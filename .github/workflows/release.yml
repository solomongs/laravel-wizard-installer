name: Publish verified release

on:
  workflow_run:
    workflows: [Package checks]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Tag the verified first release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.0';
            const {owner, repo} = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info('This version is already released; preserving its immutable tag.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag,
              target_commitish: context.payload.workflow_run.head_sha,
              name: 'Laravel Wizard Installer v1.0.0',
              body: 'Developed by Solomon Gbeta.\n\nGuided standalone setup for compatible cPanel, 20i Linux and shared PHP hosting. Includes private setup codes, hosting diagnostics, empty MySQL/MariaDB checks, per-migration progress, protected configuration, a permanent completion lock, project hooks, documentation and reusable skill.\n\nThe package checks workflow passed for this commit. Source archives are the reusable Composer package; prepare your own Laravel application with vendor and compiled assets before a customer upload.\n\nDocumentation: https://solomongs.github.io/laravel-wizard-installer/',
              draft: false, prerelease: false,
            });
